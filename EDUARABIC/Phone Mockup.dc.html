<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
<style>
  .pm-mat { font-family: 'Material Symbols Rounded'; line-height: 1; display: inline-block; }
</style>
</helmet>
<div style="width: 100%; aspect-ratio: 9 / 19.4; border-radius: 40px; padding: 9px; background: linear-gradient(160deg, #2a2f3d, #0d0f16); box-shadow: 0 40px 80px -30px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.06); font-family: 'Plus Jakarta Sans', sans-serif;">
  <div style="position: relative; width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: {{ screenBg }};">
    <div style="position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 34%; height: 16px; background: #000; border-radius: 999px; z-index: 5;"></div>
    <div style="padding: 14px 16px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 700; color: {{ headBg }};">
      <span>10:25</span>
      <span style="display: flex; gap: 4px; align-items: center;"><i class="hgi-stroke hgi-signal-full-01" style="font-size: 13px;"></i><i class="hgi-stroke hgi-wifi-01" style="font-size: 13px;"></i><i class="hgi-stroke hgi-battery-full" style="font-size: 14px;"></i></span>
    </div>

    <div style="padding: 4px 16px 0;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 26px; height: 26px; border-radius: 8px; background: {{ headBg }}; display: grid; place-items: center; color: #fff;"><i class="hgi-stroke hgi-user" style="font-size: 16px;"></i></span>
          <span style="font-family: 'Sora', sans-serif; font-weight: 700; font-size: 14px; color: #1c2230;">Hello, Ahmad</span>
        </div>
        <i class="hgi-stroke hgi-notification-01" style="font-size: 18px; color: {{ headBg }};"></i>
      </div>

      <sc-if value="{{ isLesson }}" hint-placeholder-val="{{ true }}">
        <div>
          <div style="border-radius: 16px; overflow: hidden; background: {{ headBg }}; aspect-ratio: 16/10; position: relative; display: grid; place-items: center; margin-bottom: 12px;">
            <i class="hgi-stroke hgi-play-circle" style="font-size: 40px; color: rgba(255,255,255,.95);"></i>
            <span style="position: absolute; bottom: 8px; left: 10px; font-size: 9px; font-weight: 700; color: rgba(255,255,255,.9); background: rgba(0,0,0,.28); padding: 3px 7px; border-radius: 6px;">Unit 3 · Clip 02</span>
          </div>
          <div style="font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; color: #1c2230; margin-bottom: 3px;">The Nominal Sentence</div>
          <div dir="rtl" style="font-family: 'Amiri', serif; font-size: 17px; color: {{ accent2 }}; margin-bottom: 12px;">الجُمْلَةُ الاِسْمِيَّة</div>
          <div style="background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 6px 20px -12px rgba(0,0,0,.3);">
            <div style="font-size: 10px; font-weight: 700; color: #8a90a0; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px;">Practice</div>
            <div dir="rtl" style="font-family: 'Amiri', serif; font-size: 16px; color: #1c2230; margin-bottom: 10px;">البَيْتُ ____</div>
            <div style="display: flex; gap: 6px;">
              <span style="flex: 1; text-align: center; padding: 8px; border-radius: 9px; background: {{ tint }}; font-size: 12px; font-weight: 600; color: {{ accent2 }};">كَبِيرٌ</span>
              <span style="flex: 1; text-align: center; padding: 8px; border-radius: 9px; background: #f1f2f5; font-size: 12px; font-weight: 600; color: #6b7488;">يَكْتُبُ</span>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
        <div>
          <div style="background: {{ headBg }}; border-radius: 16px; padding: 14px; color: #fff; margin-bottom: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <span style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 15px;">LEVEL 5</span>
              <span style="font-size: 9px; font-weight: 700; background: rgba(255,255,255,.2); padding: 4px 8px; border-radius: 6px;">120 XP</span>
            </div>
            <div style="font-size: 9px; letter-spacing: .1em; opacity: .8; margin-bottom: 6px;">PROGRESS</div>
            <div style="display: flex; gap: 4px;">
              <span style="flex:1;height:5px;border-radius:9px;background:{{ accent2 }};"></span>
              <span style="flex:1;height:5px;border-radius:9px;background:{{ accent2 }};"></span>
              <span style="flex:1;height:5px;border-radius:9px;background:{{ accent2 }};"></span>
              <span style="flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.3);"></span>
              <span style="flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.3);"></span>
            </div>
          </div>
          <div style="font-family: 'Sora', sans-serif; font-weight: 700; font-size: 12px; color: {{ accent2 }}; margin-bottom: 6px;">Continue learning</div>
          <div style="background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 6px 20px -12px rgba(0,0,0,.3); margin-bottom: 10px;">
            <div style="display: flex; gap: 6px; margin-bottom: 8px;">
              <span style="font-size: 9px; font-weight: 700; color: {{ accent2 }}; background: {{ tint }}; padding: 3px 8px; border-radius: 6px;">NAHW</span>
              <span style="font-size: 9px; font-weight: 700; color: {{ accent2 }}; border: 1px solid {{ tint }}; padding: 3px 8px; border-radius: 6px;">Unit 3</span>
            </div>
            <div style="font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; color: #1c2230;">The Nominal Sentence</div>
            <div dir="rtl" style="font-family: 'Amiri', serif; font-size: 15px; color: #6b7488;">الجُمْلَةُ الاِسْمِيَّة</div>
          </div>
          <div style="font-family: 'Sora', sans-serif; font-weight: 700; font-size: 12px; color: {{ accent2 }}; margin-bottom: 6px;">Free audio</div>
          <div style="background: #fff; border-radius: 14px; padding: 10px 12px; box-shadow: 0 6px 20px -12px rgba(0,0,0,.3); display: flex; align-items: center; gap: 10px;">
            <span style="width: 30px; height: 30px; border-radius: 9px; background: {{ tint }}; display: grid; place-items: center; color: {{ accent2 }};"><i class="hgi-stroke hgi-headphones" style="font-size: 18px;"></i></span>
            <div style="flex: 1;"><div style="font-size: 11px; font-weight: 700; color: #1c2230;">Daily Arabic Podcast</div><div style="font-size: 10px; color: #8a90a0;">Ep. 12 · 6 min</div></div>
            <i class="hgi-stroke hgi-play-circle" style="font-size: 22px; color: {{ accent2 }};"></i>
          </div>
        </div>
      </sc-if>
    </div>

    <div style="position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eceef2; padding: 10px 16px 16px; display: flex; justify-content: space-between;">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: {{ n.color }};"><i class="hgi-stroke hgi-{{ n.icon }}" style="font-size: 20px;"></i><span style="font-size: 8px; font-weight: 600;">{{ n.label }}</span></span>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;280px&quot;,&quot;height&quot;:&quot;580px&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;teal&quot;,&quot;sand&quot;,&quot;crimson&quot;],&quot;default&quot;:&quot;teal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;lesson&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant || "teal";
    const screen = this.props.screen || "home-01";
    const themes = {
      teal:    { headBg: "#17756A", accent2: "#0F5F52", tint: "#E1EEE9", screenBg: "#EAF6F2" },
      sand:    { headBg: "#C0913F", accent2: "#9A6E1E", tint: "#F5EAD4", screenBg: "#F8F1E3" },
      crimson: { headBg: "#A33241", accent2: "#8C2233", tint: "#F6E1E4", screenBg: "#F8ECED" },
    };
    const t = themes[variant] || themes.teal;
    const accent2 = t.accent2;
    const navItems = [
      { icon: "home-01", label: "Home" },
      { icon: "route-01", label: "Path" },
      { icon: "headphones", label: "Audio" },
      { icon: "ai-brain-01", label: "AI" },
    ];
    const activeIdx = screen === "lesson" ? 1 : 0;
    return {
      ...t,
      isHome: screen === "home-01",
      isLesson: screen === "lesson",
      nav: navItems.map((n, i) => ({ ...n, color: i === activeIdx ? accent2 : "#b4b9c4" })),
    };
  }
}
</script>
</body>
</html>
