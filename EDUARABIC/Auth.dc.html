<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #070A14; }
  .ea {
    --bg: #070A14;
    --panel: rgba(255,255,255,.035);
    --panel-2: rgba(255,255,255,.06);
    --ink: #F3F5FA;
    --ink-soft: #A2AABD;
    --ink-faint: #6B7488;
    --primary: #2FC49F;
    --gold: #F0B429;
    --border: rgba(255,255,255,.09);
    --border-soft: rgba(255,255,255,.055);
  }
  .ea a { color: inherit; }
  .ea input { font-family: inherit; }
  .ea input::placeholder { color: var(--ink-faint); }
  .ea input:focus { outline: none; border-color: var(--primary); }
  .ea-mat { font-family: 'Material Symbols Rounded'; line-height: 1; display: inline-block; }
  @keyframes eaFade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</helmet>
<div class="ea" style="position: relative; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden;">

  <div style="position: absolute; inset: 0; z-index: 0; pointer-events: none; background:
    radial-gradient(900px 600px at 12% 20%, rgba(70,86,200,.20), transparent 65%),
    radial-gradient(800px 600px at 92% 85%, rgba(47,196,159,.12), transparent 60%);"></div>

  <div style="position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; padding: 60px 72px;">
    <a href="Landing Page.dc.html" style="display: flex; align-items: center; text-decoration: none; margin-bottom: 52px;"><img src="assets/logo.png" alt="EduArabic for All" style="height: 42px; width: auto;"></a>
    <h1 style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 64px; line-height: 1.0; letter-spacing: -.03em; margin: 0 0 24px;">One account.<br>Every lesson.</h1>
    <p style="font-size: 18px; line-height: 1.6; color: var(--ink-soft); max-width: 400px; margin: 0 0 36px;">Sign in to sync your progress, streak and modules across every device — and pick up your Arabic exactly where you left off.</p>
    <div style="display: flex; flex-direction: column; gap: 16px; max-width: 380px;">
      <sc-for list="{{ perks }}" as="p" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 13px; color: var(--ink-soft); font-size: 15px;">
          <span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: var(--panel-2); display: grid; place-items: center; color: var(--primary);"><i class="hgi-stroke hgi-{{ p.icon }}" style="font-size: 19px;"></i></span>
          {{ p.text }}
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; padding: 40px;">
    <div style="width: 100%; max-width: 420px; border-radius: 26px; padding: 40px 38px; background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(8px); box-shadow: 0 40px 90px -40px rgba(0,0,0,.7); animation: eaFade .5s ease both;">
      <div style="display: flex; justify-content: center; margin-bottom: 26px;">
        <img src="assets/logo.png" alt="EduArabic for All" style="height: 44px; width: auto; display: block;">
      </div>

      <div style="display: flex; background: var(--panel-2); border-radius: 12px; padding: 5px; margin-bottom: 28px;">
        <button onClick="{{ setSignin }}" style="flex: 1; padding: 10px; border: none; border-radius: 9px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700; background: {{ signinTabBg }}; color: {{ signinTabColor }};">Sign in</button>
        <button onClick="{{ setJoin }}" style="flex: 1; padding: 10px; border: none; border-radius: 9px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700; background: {{ joinTabBg }}; color: {{ joinTabColor }};">Create account</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 22px;">
        <sc-if value="{{ isJoin }}" hint-placeholder-val="{{ true }}">
          <input type="text" placeholder="Full name" style="width: 100%; padding: 15px 16px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--border); color: var(--ink); font-size: 15px;">
        </sc-if>
        <input type="email" placeholder="Email" style="width: 100%; padding: 15px 16px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--border); color: var(--ink); font-size: 15px;">
        <input type="password" placeholder="{{ pwPlaceholder }}" style="width: 100%; padding: 15px 16px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--border); color: var(--ink); font-size: 15px;">
        <sc-if value="{{ isSignin }}" hint-placeholder-val="{{ true }}">
          <a href="#" style="align-self: flex-end; font-size: 13px; color: var(--ink-soft); text-decoration: none;" style-hover="color: var(--primary);">Forgot password?</a>
        </sc-if>
      </div>

      <a href="Student Dashboard.dc.html" style="display: block; text-align: center; padding: 15px; border-radius: 12px; background: var(--ink); color: #0A0E1A; text-decoration: none; font-weight: 700; font-size: 15px; margin-bottom: 24px;" style-hover="opacity: .92;">{{ primaryLabel }}</a>

      <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 22px;">
        <span style="flex: 1; height: 1px; background: var(--border-soft);"></span>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: .18em; color: var(--ink-faint);">OR CONTINUE WITH</span>
        <span style="flex: 1; height: 1px; background: var(--border-soft);"></span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 26px;">
        <a href="Student Dashboard.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 11px; padding: 13px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--border); text-decoration: none; font-weight: 600; font-size: 14.5px;" style-hover="border-color: var(--ink-faint);">
          <span style="width: 20px; height: 20px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #4285F4; font-family: 'Sora', sans-serif;">G</span> Google
        </a>
        <a href="Student Dashboard.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 11px; padding: 13px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--border); text-decoration: none; font-weight: 600; font-size: 14.5px;" style-hover="border-color: var(--ink-faint);">
          <i class="hgi-stroke hgi-smart-phone-01" style="font-size: 20px;"></i> Apple
        </a>
      </div>

      <a href="Landing Page.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink-faint); font-size: 12px; font-weight: 700; letter-spacing: .14em;" style-hover="color: var(--ink-soft);"><i class="hgi-stroke hgi-arrow-left-01" style="font-size: 16px;"></i> BACK TO HOME</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mode: "signin" };
  renderVals() {
    const isJoin = this.state.mode === "join";
    const active = { bg: "var(--ink)", color: "#0A0E1A" };
    const idle = { bg: "transparent", color: "var(--ink-soft)" };
    const s = isJoin ? idle : active;
    const j = isJoin ? active : idle;
    return {
      isJoin,
      isSignin: !isJoin,
      perks: [
        { icon: "refresh", text: "Progress & streaks synced everywhere" },
        { icon: "ai-brain-01", text: "Your AI Ustaz history, saved" },
        { icon: "lock", text: "Secure — sign in with Google or Apple" },
      ],
      setSignin: () => this.setState({ mode: "signin" }),
      setJoin: () => this.setState({ mode: "join" }),
      signinTabBg: s.bg, signinTabColor: s.color,
      joinTabBg: j.bg, joinTabColor: j.color,
      pwPlaceholder: isJoin ? "Password (min. 8 characters)" : "Password",
      primaryLabel: isJoin ? "Create account" : "Sign in",
    };
  }
}
</script>
</body>
</html>
