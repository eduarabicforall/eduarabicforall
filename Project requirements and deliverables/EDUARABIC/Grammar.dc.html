<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
  <style>
    body{margin:0;background:#05070d;color:#F3F5FA;font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:36px 12px;background:#05070d;">
  <div style="width:402px;max-width:100%;background:#070A14;border:1px solid rgba(255,255,255,.09);border-radius:36px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.5);min-height:820px;">

    <div style="padding:22px 20px 16px;background:linear-gradient(180deg, rgba(240,180,41,.10), transparent);">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:38px;height:38px;border-radius:11px;background:rgba(240,180,41,.18);display:flex;align-items:center;justify-content:center;"><i class="hgi-stroke hgi-mortarboard-01" style="color:#F0B429;font-size:19px;"></i></div>
          <div>
            <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:17px;">Grammar module</div>
          </div>
        </div>
        <div style="background:rgba(240,180,41,.16);border:1px solid rgba(240,180,41,.3);color:#F0B429;font-size:11px;font-weight:800;padding:5px 11px;border-radius:100px;">FREE</div>
      </div>
    </div>

    <div style="padding:16px 20px;">
      <sc-for list="{{ topics }}" as="t" hint-placeholder-count="6">
        <a href="GrammarTopic.dc.html" style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);border-radius:16px;padding:14px;margin-bottom:10px;text-decoration:none;color:inherit;">
          <div style="width:40px;height:40px;border-radius:11px;background:rgba(240,180,41,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <i class="hgi-stroke {{ t.icon }}" style="color:#F0B429;font-size:18px;"></i>
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:13.5px;">{{ t.titleEn }}</div>
          </div>
          <sc-if value="{{ t.done }}" hint-placeholder-val="{{ false }}">
            <i class="hgi-stroke hgi-checkmark-circle-02" style="color:#2FC49F;font-size:18px;"></i>
          </sc-if>
          <sc-if value="{{ t.locked }}" hint-placeholder-val="{{ false }}">
            <i class="hgi-stroke hgi-arrow-right-01" style="color:#6B7488;font-size:16px;"></i>
          </sc-if>
        </a>
      </sc-for>
    </div>

    <div style="height:76px;"></div>
    <div style="position:sticky;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:14px 10px 20px;background:rgba(7,10,20,.9);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.09);">
      <a href="Dashboard.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7488;text-decoration:none;"><i class="hgi-stroke hgi-home-01" style="font-size:20px;"></i><span style="font-size:10.5px;font-weight:600;">Home</span></a>
      <a href="Grammar.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#F0B429;text-decoration:none;"><i class="hgi-stroke hgi-mortarboard-01" style="font-size:20px;"></i><span style="font-size:10.5px;font-weight:600;">Grammar</span></a>
      <a href="AIUstaz.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7488;text-decoration:none;"><i class="hgi-stroke hgi-message-01" style="font-size:20px;"></i><span style="font-size:10.5px;font-weight:600;">AI Ustaz</span></a>
      <a href="Shop.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7488;text-decoration:none;"><i class="hgi-stroke hgi-shopping-bag-02" style="font-size:20px;"></i><span style="font-size:10.5px;font-weight:600;">Shop</span></a>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      topics: [
        { titleEn: 'Nouns & articles', titleAr: 'الاسم وأل التعريف', icon: 'hgi-book-02', done: true },
        { titleEn: 'Verb conjugation', titleAr: 'تصريف الأفعال', icon: 'hgi-book-02', done: true },
        { titleEn: 'Sentence structure', titleAr: 'تركيب الجملة', icon: 'hgi-book-02', locked: true },
        { titleEn: 'Case endings (i\u2019rab)', titleAr: 'الإعراب', icon: 'hgi-book-02', locked: true },
        { titleEn: 'Pronouns', titleAr: 'الضمائر', icon: 'hgi-book-02', locked: true },
        { titleEn: 'Common particles', titleAr: 'الحروف', icon: 'hgi-book-02', locked: true },
      ],
    };
  }
}
</script>
</body>
</html>
