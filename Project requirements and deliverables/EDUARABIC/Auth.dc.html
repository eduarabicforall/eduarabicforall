<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&amp;family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;family=Amiri:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
  <style>
    body{margin:0;background:#070A14;color:#F3F5FA;font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
    a{color:#2FC49F;text-decoration:none}
    a:hover{color:#58d6b6}
    * { box-sizing: border-box; }
    input::placeholder{color:#6B7488}
  </style>
</helmet>

<div style="min-height:100vh;display:flex;background:#070A14;">

  <div style="display:flex;align-items:center;justify-content:center;padding:40px;width:100%;">
    <div style="max-width:400px;width:100%;">
      <a href="Landing.dc.html" style="display:inline-flex;align-items:center;gap:6px;color:#A2AABD;font-size:13px;font-weight:600;margin-bottom:24px;">
        <i class="hgi-stroke hgi-arrow-left-01" style="font-size:14px;"></i> Back to site
      </a>
      

      <sc-if value="{{ isSignin }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:18px;">
          <div>
            <h1 style="font-family: 'Sora',sans-serif; font-weight: 800; font-size: 28px; margin: 0 0 6px; text-align: center">Sign in</h1>
            
          </div>
          <button style="display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:#F3F5FA;font-weight:600;font-size:14px;padding:13px;border-radius:12px;cursor:pointer;">
            <i class="hgi-stroke hgi-google" style="font-size:16px;"></i> Continue with Google
          </button>
          <div style="display:flex;align-items:center;gap:10px;color:#6B7488;font-size:12px;"><div style="flex:1;height:1px;background:rgba(255,255,255,.09);"></div>or<div style="flex:1;height:1px;background:rgba(255,255,255,.09);"></div></div>
          <label style="font-size:13px;color:#A2AABD;font-weight:600;">Email
            <input type="email" placeholder="you@email.com" style="display:block;width:100%;margin-top:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 14px;color:#F3F5FA;font-size:14px;font-family:inherit;">
          </label>
          <label style="font-size:13px;color:#A2AABD;font-weight:600;">Password
            <input type="password" placeholder="••••••••" style="display:block;width:100%;margin-top:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 14px;color:#F3F5FA;font-size:14px;font-family:inherit;">
          </label>
          <div style="text-align:right;margin-top:-10px;"><a href="#" onClick="{{ goForgot }}" style="font-size:13px;color:#A2AABD;font-weight:600;">Forgot password?</a></div>
          <button style="background:#2FC49F;color:#04241C;font-weight:700;font-size:15px;padding:14px;border-radius:12px;border:none;cursor:pointer;margin-top:4px;">Sign in</button>
          <p style="text-align:center;color:#A2AABD;font-size:13px;margin:6px 0 0;">No account? <a href="#" onClick="{{ goSignup }}" style="font-weight:700;">Sign up</a></p>
        </div>
      </sc-if>

      <sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:18px;">
          <div>
            <h1 style="font-family: 'Sora',sans-serif; font-weight: 800; font-size: 28px; margin: 0 0 6px; text-align: center">Create account</h1>
            
          </div>
          <button style="display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:#F3F5FA;font-weight:600;font-size:14px;padding:13px;border-radius:12px;cursor:pointer;">
            <i class="hgi-stroke hgi-google" style="font-size:16px;"></i> Continue with Google
          </button>
          <div style="display:flex;align-items:center;gap:10px;color:#6B7488;font-size:12px;"><div style="flex:1;height:1px;background:rgba(255,255,255,.09);"></div>or<div style="flex:1;height:1px;background:rgba(255,255,255,.09);"></div></div>
          <label style="font-size:13px;color:#A2AABD;font-weight:600;">Full name
            <input type="text" placeholder="Your name" style="display:block;width:100%;margin-top:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 14px;color:#F3F5FA;font-size:14px;font-family:inherit;">
          </label>
          <label style="font-size:13px;color:#A2AABD;font-weight:600;">Email
            <input type="email" placeholder="you@email.com" style="display:block;width:100%;margin-top:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 14px;color:#F3F5FA;font-size:14px;font-family:inherit;">
          </label>
          <label style="font-size:13px;color:#A2AABD;font-weight:600;">Password
            <input type="password" placeholder="At least 8 characters" style="display:block;width:100%;margin-top:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 14px;color:#F3F5FA;font-size:14px;font-family:inherit;">
          </label>
          <button style="background:#2FC49F;color:#04241C;font-weight:700;font-size:15px;padding:14px;border-radius:12px;border:none;cursor:pointer;margin-top:4px;">Create account</button>
          <p style="text-align:center;color:#A2AABD;font-size:13px;margin:6px 0 0;">Already have an account? <a href="#" onClick="{{ goSignin }}" style="font-weight:700;">Sign in</a></p>
        </div>
      </sc-if>

      <sc-if value="{{ isForgot }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:18px;">
          <div>
            <h1 style="font-family:'Sora',sans-serif;font-weight:800;font-size:28px;margin:0 0 6px;">Reset password</h1>
            <p style="color:#A2AABD;font-size:14px;margin:0;">We'll email you a link to reset it.</p>
          </div>
          <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
            <div>
              <label style="font-size:13px;color:#A2AABD;font-weight:600;">Email
                <input type="email" placeholder="you@email.com" style="display:block;width:100%;margin-top:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 14px;color:#F3F5FA;font-size:14px;font-family:inherit;">
              </label>
              <button onClick="{{ sendReset }}" style="background:#2FC49F;color:#04241C;font-weight:700;font-size:15px;padding:14px;border-radius:12px;border:none;cursor:pointer;margin-top:18px;width:100%;">Send reset link</button>
            </div>
          </sc-if>
          <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;background:rgba(47,196,159,.08);border:1px solid rgba(47,196,159,.22);border-radius:16px;padding:28px 20px;">
              <div style="width:44px;height:44px;border-radius:12px;background:rgba(47,196,159,.18);display:flex;align-items:center;justify-content:center;"><i class="hgi-stroke hgi-mail-01" style="color:#2FC49F;font-size:22px;"></i></div>
              <div style="font-weight:700;font-size:15px;">Check your email</div>
              <div style="color:#A2AABD;font-size:13px;line-height:1.5;">We've sent a password reset link. It expires in 30 minutes.</div>
            </div>
          </sc-if>
          <p style="text-align:center;color:#A2AABD;font-size:13px;margin:6px 0 0;"><a href="#" onClick="{{ goSignin }}" style="font-weight:700;">← Back to sign in</a></p>
        </div>
      </sc-if>

    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { view: 'signin', sent: false };
  renderVals() {
    const v = this.state.view;
    return {
      isSignin: v === 'signin',
      isSignup: v === 'signup',
      isForgot: v === 'forgot',
      notSent: !this.state.sent,
      sent: this.state.sent,
      goSignin: (e) => { e.preventDefault(); this.setState({ view: 'signin', sent: false }); },
      goSignup: (e) => { e.preventDefault(); this.setState({ view: 'signup' }); },
      goForgot: (e) => { e.preventDefault(); this.setState({ view: 'forgot' }); },
      sendReset: (e) => { e.preventDefault(); this.setState({ sent: true }); },
    };
  }
}
</script>
</body>
</html>
