<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
  <style>
    body{margin:0;background:#05070d;color:#F3F5FA;font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
    a{color:#2FC49F;text-decoration:none}
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:36px 12px;background:#05070d;">
  <div style="width:402px;max-width:100%;background:#070A14;border:1px solid rgba(255,255,255,.09);border-radius:36px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.5);">

    <div style="padding:22px 20px 18px;background:linear-gradient(180deg, rgba(47,196,159,.10), transparent);display:flex;justify-content:space-between;align-items:center;">
      <div style="display:flex;align-items:center;gap:12px;position:relative;">
        <button onClick="{{ toggleMenu }}" style="width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#2FC49F,#1C6D5C);display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:17px;color:#04241C;flex-shrink:0;border:none;cursor:pointer;padding:0;">NA</button>
        <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:52px;left:0;z-index:30;width:220px;background:#0B1020;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:8px;box-shadow:0 20px 40px rgba(0,0,0,.45);">
            <div style="padding:10px 12px 8px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:4px;">
              <div style="font-weight:700;font-size:13px;">Nur Aisyah</div>
              <div style="color:#6B7488;font-size:11px;">nur.aisyah@email.com</div>
            </div>
            <button style="width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;background:transparent;border:none;color:#F3F5FA;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:9px;">
              <i class="hgi-stroke hgi-user" style="font-size:16px;color:#A2AABD;"></i>Profile settings
            </button>
            <button style="width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;background:transparent;border:none;color:#F3F5FA;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:9px;">
              <i class="hgi-stroke hgi-image-02" style="font-size:16px;color:#A2AABD;"></i>Change background
            </button>
            <div style="height:1px;background:rgba(255,255,255,.06);margin:4px 0;"></div>
            <button style="width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;background:transparent;border:none;color:#f06868;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:9px;">
              <i class="hgi-stroke hgi-logout-01" style="font-size:16px;"></i>Log out
            </button>
          </div>
        </sc-if>
        <div>
          <div style="color:#6B7488;font-size:12px;font-weight:600;">Assalamualaikum,</div>
          <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:19px;">Nur Aisyah</div>
        </div>
      </div>
      <div style="width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;">
        <i class="hgi-stroke hgi-notification-01" style="font-size:18px;color:#A2AABD;"></i>
      </div>
    </div>

    <div style="padding:14px 20px 8px;">
      <div style="font-size:13px;font-weight:700;color:#A2AABD;letter-spacing:.02em;margin-bottom:12px;">MY MODULES</div>
      <sc-for list="{{ modules }}" as="m" hint-placeholder-count="2">
        <div style="background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);border-radius:18px;padding:16px;margin-bottom:12px;display:flex;gap:14px;align-items:center;">
          <div style="width:52px;height:52px;border-radius:13px;flex-shrink:0;background:repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 6px, rgba(255,255,255,.02) 6px 12px);"></div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:14px;margin-bottom:6px;">{{ m.name }}</div>
            <div style="height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:6px;">
              <div style="height:100%;border-radius:4px;background:#2FC49F;width:{{ m.progress }}%;"></div>
            </div>
            <div style="color:#6B7488;font-size:11px;">{{ m.progress }}% · {{ m.unitsDone }}/{{ m.unitsTotal }} units</div>
          </div>
          <div style="width:34px;height:34px;border-radius:10px;background:rgba(47,196,159,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <i class="hgi-stroke hgi-arrow-right-01" style="color:#2FC49F;font-size:16px;"></i>
          </div>
        </div>
      </sc-for>

      <div style="border:1.5px dashed rgba(47,196,159,.35);border-radius:18px;padding:22px 18px;text-align:center;margin:18px 0 8px;background:rgba(47,196,159,.05);">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(47,196,159,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">
          <i class="hgi-stroke hgi-qr-code" style="color:#2FC49F;font-size:22px;"></i>
        </div>
        <div style="font-weight:700;font-size:15px;margin-bottom:4px;">Activate a new module</div>
        <div style="color:#A2AABD;font-size:12.5px;margin-bottom:16px;">Scan the QR in your module or enter its code.</div>
        <button style="background:#2FC49F;color:#04241C;font-weight:700;font-size:14px;padding:12px 22px;border-radius:12px;border:none;cursor:pointer;">Enter code</button>
      </div>

      <a href="#" style="display:flex;align-items:center;gap:12px;background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.22);border-radius:16px;padding:14px 16px;margin-top:14px;">
        <i class="hgi-stroke hgi-mortarboard-01" style="color:#F0B429;font-size:20px;"></i>
        <div style="flex:1;">
          <div style="font-weight:700;font-size:13px;color:#F3F5FA;">Grammar module</div>
          <div style="color:#A2AABD;font-size:11.5px;">Free for your account</div>
        </div>
        <i class="hgi-stroke hgi-arrow-right-01" style="color:#F0B429;font-size:16px;"></i>
      </a>
    </div>

    <div style="height:76px;"></div>

    <div style="position:sticky;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:14px 10px 20px;background:rgba(7,10,20,.9);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.09);">
      <a href="Dashboard.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#2FC49F;text-decoration:none;"><i class="hgi-stroke hgi-home-01" style="font-size:20px;"></i><span style="font-size:10.5px;font-weight:600;">Home</span></a>
      <a href="Grammar.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7488;text-decoration:none;"><i class="hgi-stroke hgi-mortarboard-01" style="font-size:20px;"></i><span style="font-size:10.5px;font-weight:600;">Grammar</span></a>
      <a href="AIUstaz.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7488;text-decoration:none;"><i class="hgi-stroke hgi-message-01" style="font-size:20px;"></i><span style="font-size:10.5px;font-weight:600;">AI Ustaz</span></a>
      <a href="Shop.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7488;text-decoration:none;"><i class="hgi-stroke hgi-shopping-bag-02" style="font-size:20px;"></i><span style="font-size:10.5px;font-weight:600;">Shop</span></a>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    return {
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      modules: [
        { name: 'Bahasa Arab Pemula', progress: 62, unitsDone: 201, unitsTotal: 324 },
        { name: 'Bahasa Arab Al Quran', progress: 24, unitsDone: 47, unitsTotal: 198 },
      ],
    };
  }
}
</script>
</body>
</html>
