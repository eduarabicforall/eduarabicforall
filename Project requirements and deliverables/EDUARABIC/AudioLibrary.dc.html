<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
  <style>
    body{margin:0;background:#05070d;color:#F3F5FA;font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:36px 12px;background:#05070d;">
  <div style="width:402px;max-width:100%;background:#070A14;border:1px solid rgba(255,255,255,.09);border-radius:36px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.5);min-height:820px;">

    <div style="padding:22px 20px 6px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
        <div style="width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;"><i class="hgi-stroke hgi-arrow-left-01" style="font-size:16px;color:#A2AABD;"></i></div>
        <div>
          <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:16px;">Audio Library</div>
          <div style="color:#6B7488;font-size:11.5px;">Bahasa Arab Al Quran</div>
        </div>
      </div>

      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;">
        <sc-for list="{{ units }}" as="u" hint-placeholder-count="4">
          <button onClick="{{ u.select }}" style="flex-shrink:0;padding:9px 16px;border-radius:100px;font-size:12.5px;font-weight:700;white-space:nowrap;border:1px solid {{ u.borderColor }};background:{{ u.bg }};color:{{ u.color }};cursor:pointer;">{{ u.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="padding:16px 20px 8px;">
      <sc-for list="{{ tracks }}" as="t" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);border-radius:16px;padding:12px 14px;margin-bottom:10px;">
          <button onClick="{{ t.toggle }}" style="width:38px;height:38px;border-radius:11px;border:none;flex-shrink:0;background:{{ t.playBg }};display:flex;align-items:center;justify-content:center;cursor:pointer;">
            <i class="hgi-stroke {{ t.icon }}" style="font-size:16px;color:{{ t.iconColor }};"></i>
          </button>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:13px;margin-bottom:2px;">{{ t.titleEn }}</div>
            <div dir="rtl" style="font-family:'Amiri',serif;font-size:14px;color:#A2AABD;margin-bottom:6px;">{{ t.titleAr }}</div>
            <sc-if value="{{ t.playing }}" hint-placeholder-val="{{ false }}">
              <div style="height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;">
                <div style="height:100%;border-radius:3px;background:#2FC49F;width:{{ t.progress }}%;"></div>
              </div>
            </sc-if>
          </div>
          <div style="color:#6B7488;font-size:11px;flex-shrink:0;">{{ t.duration }}</div>
        </div>
      </sc-for>
    </div>

    <div style="height:76px;"></div>
    <div style="position:sticky;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:14px 10px 20px;background:rgba(7,10,20,.9);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.09);">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7488;"><i class="hgi-stroke hgi-home-01" style="font-size:20px;"></i><span style="font-size:10.5px;font-weight:600;">Home</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7488;"><i class="hgi-stroke hgi-mortarboard-01" style="font-size:20px;"></i><span style="font-size:10.5px;font-weight:600;">Grammar</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7488;"><i class="hgi-stroke hgi-shopping-bag-02" style="font-size:20px;"></i><span style="font-size:10.5px;font-weight:600;">Shop</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7488;"><i class="hgi-stroke hgi-message-01" style="font-size:20px;"></i><span style="font-size:10.5px;font-weight:600;">AI Ustaz</span></div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    currentUnit: 1,
    playingId: 2,
  };
  unitDefs = [
    { id: 1, label: 'Unit 1' },
    { id: 2, label: 'Unit 2' },
    { id: 3, label: 'Unit 3' },
    { id: 4, label: 'Unit 4' },
  ];
  trackDefs = {
    1: [
      { id: 1, titleEn: 'Greetings', titleAr: 'التحيات', duration: '2:14' },
      { id: 2, titleEn: 'Introducing yourself', titleAr: 'التعريف بالنفس', duration: '3:02' },
      { id: 3, titleEn: 'Numbers 1–10', titleAr: 'الأرقام ١-١٠', duration: '1:48' },
    ],
    2: [
      { id: 1, titleEn: 'Surah al-Fatihah recitation', titleAr: 'سورة الفاتحة', duration: '1:32' },
      { id: 2, titleEn: 'Oath particles explained', titleAr: 'حروف القسم', duration: '4:10' },
      { id: 3, titleEn: 'Vocabulary drill', titleAr: 'تمرين المفردات', duration: '2:55' },
      { id: 4, titleEn: 'Listening comprehension', titleAr: 'فهم المسموع', duration: '3:20' },
    ],
    3: [
      { id: 1, titleEn: 'Root letters intro', titleAr: 'الجذور', duration: '3:44' },
      { id: 2, titleEn: 'Common patterns', titleAr: 'الأوزان الشائعة', duration: '2:36' },
    ],
    4: [
      { id: 1, titleEn: 'Review & quiz audio', titleAr: 'مراجعة واختبار', duration: '5:01' },
    ],
  };
  renderVals() {
    const cu = this.state.currentUnit;
    const units = this.unitDefs.map((u) => ({
      label: u.label,
      borderColor: u.id === cu ? '#2FC49F' : 'rgba(255,255,255,.09)',
      bg: u.id === cu ? 'rgba(47,196,159,.15)' : 'rgba(255,255,255,.05)',
      color: u.id === cu ? '#2FC49F' : '#A2AABD',
      select: () => this.setState({ currentUnit: u.id, playingId: null }),
    }));
    const tracks = (this.trackDefs[cu] || []).map((t) => {
      const playing = this.state.playingId === t.id;
      return {
        titleEn: t.titleEn, titleAr: t.titleAr, duration: t.duration,
        playing,
        progress: playing ? 42 : 0,
        icon: playing ? 'hgi-pause' : 'hgi-play',
        playBg: playing ? '#2FC49F' : 'rgba(255,255,255,.08)',
        iconColor: playing ? '#04241C' : '#F3F5FA',
        toggle: () => this.setState({ playingId: playing ? null : t.id }),
      };
    });
    return { units, tracks };
  }
}
</script>
</body>
</html>
