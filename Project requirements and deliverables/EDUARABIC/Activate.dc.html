<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&amp;family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;family=Amiri:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
  <style>
    body{margin:0;background:#05070d;color:#F3F5FA;font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
    * { box-sizing: border-box; }
    input::placeholder{color:#6B7488}
  </style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:36px 12px;background:#05070d;">
  <div style="width:402px;max-width:100%;background:#070A14;border:1px solid rgba(255,255,255,.09);border-radius:36px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.5);min-height:820px;">

    <div style="display:flex;align-items:center;gap:12px;padding:22px 20px 6px;">
      <div style="width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;"><i class="hgi-stroke hgi-arrow-left-01" style="font-size:16px;color:#A2AABD;"></i></div>
      <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:16px;">Activate module</div>
    </div>

    <div style="padding:26px 24px;">

      <sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;">
          <div style="width:56px;height:56px;border-radius:16px;background:rgba(47,196,159,.14);display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
            <i class="hgi-stroke hgi-key-01" style="color:#2FC49F;font-size:26px;"></i>
          </div>
          <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:19px;margin-bottom:6px;">Enter your activation code</div>
          <div style="color:#A2AABD;font-size:13px;line-height:1.5;margin-bottom:26px;">Find the unique code printed inside your physical module.</div>

          <div style="display:flex;gap:8px;width:100%;">
            <input value="{{ part1 }}" onChange="{{ setPart1 }}" maxlength="4" placeholder="XXXX" style="flex:1;text-align:center;text-transform:uppercase;letter-spacing:.15em;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:16px 8px;color:#F3F5FA;font-size:18px;font-family:'Sora',sans-serif;font-weight:700;">
            
            
          </div>

          <button onClick="{{ activate }}" style="width:100%;background:#2FC49F;color:#04241C;font-weight:700;font-size:15px;padding:15px;border-radius:13px;border:none;cursor:pointer;margin-top:22px;">Activate</button>

          
          

          
        </div>
      </sc-if>

      <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;">
          <div style="width:56px;height:56px;border-radius:16px;background:rgba(240,90,90,.14);display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
            <i class="hgi-stroke hgi-alert-circle" style="color:#f06868;font-size:26px;"></i>
          </div>
          <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:19px;margin-bottom:6px;">Invalid code</div>
          <div style="color:#A2AABD;font-size:13px;line-height:1.5;margin-bottom:26px;">We couldn't find that activation code. Check for typos and try again.</div>
          <button onClick="{{ reset }}" style="width:100%;background:#2FC49F;color:#04241C;font-weight:700;font-size:15px;padding:15px;border-radius:13px;border:none;cursor:pointer;">Try again</button>
        </div>
      </sc-if>

      <sc-if value="{{ isSuccess }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;">
          <div style="width:56px;height:56px;border-radius:16px;background:rgba(47,196,159,.18);display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
            <i class="hgi-stroke hgi-checkmark-circle-02" style="color:#2FC49F;font-size:26px;"></i>
          </div>
          <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:19px;margin-bottom:20px;">Module activated!</div>
          <div style="width:100%;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:24px;">
            <div style="width:52px;height:52px;border-radius:13px;flex-shrink:0;background:repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 6px, rgba(255,255,255,.02) 6px 12px);"></div>
            <div style="text-align:left;">
              <div style="font-weight:700;font-size:14px;">Bahasa Arab Al Quran</div>
              <div style="color:#6B7488;font-size:11.5px;">198 units · Audio + AI Ustaz unlocked</div>
            </div>
          </div>
          <button style="width:100%;background:#2FC49F;color:#04241C;font-weight:700;font-size:15px;padding:15px;border-radius:13px;border:none;cursor:pointer;">Start learning</button>
        </div>
      </sc-if>

    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { status: 'idle', part1: '', part2: '' };
  renderVals() {
    return {
      isIdle: this.state.status === 'idle',
      isError: this.state.status === 'error',
      isSuccess: this.state.status === 'success',
      part1: this.state.part1,
      part2: this.state.part2,
      setPart1: (e) => this.setState({ part1: e.target.value }),
      setPart2: (e) => this.setState({ part2: e.target.value }),
      activate: () => {
        const valid = this.state.part1.length === 4 && this.state.part2.length === 4;
        this.setState({ status: valid ? 'success' : 'error' });
      },
      reset: () => this.setState({ status: 'idle' }),
    };
  }
}
</script>
</body>
</html>
